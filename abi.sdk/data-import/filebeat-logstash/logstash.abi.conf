# =============================================================================
# ABI Logstash 管道配置：接收 Filebeat 的 LoggerConsumer JSONL 并转发至 ABI 采集网关
# 对标 ThinkingData v3.4「Filebeat + Logstash 使用指南」
# 启动命令：bin/logstash -f filebeat-logstash/logstash.abi.conf
# =============================================================================

input {
  beats {
    port => 5044
    host => "0.0.0.0"
    client_inactivity_timeout => 120
  }
}

filter {
  # 1. 解析 LoggerConsumer 写入的单行 TrackEvent JSON
  json {
    source => "message"
    target => "[@metadata][abi_event]"
    skip_on_invalid_json => true
  }

  # 过滤非法 JSON 行或空行
  if ![@metadata][abi_event] or ![@metadata][abi_event][event_name] {
    drop { }
  }

  # 2. 提取项目凭证与标准化单条事件结构（保留 #ip / $ip 供 Flink 解析客户端真实地域）
  ruby {
    code => '
      evt = event.get("[@metadata][abi_event]") || {}
      props = evt["properties"].is_a?(Hash) ? evt["properties"] : {}

      # 补齐幂等主键 event_id
      if evt["event_id"].nil? || evt["event_id"].to_s.strip.empty?
        require "securerandom"
        evt["event_id"] = SecureRandom.uuid
      end

      # 若顶层未传毫秒 timestamp，则支持从 properties["#time"] / "$time" 提取并剥离
      raw_time = props.delete("#time") || props.delete("$time")
      if (evt["timestamp"].nil? || evt["timestamp"].to_i <= 0) && !raw_time.nil?
        if raw_time.is_a?(Numeric)
          evt["timestamp"] = raw_time < 100_000_000_000 ? (raw_time * 1000).round : raw_time.round
        end
      end
      evt["timestamp"] = (Time.now.to_f * 1000).round if evt["timestamp"].nil? || evt["timestamp"].to_i <= 0
      evt["properties"] = props

      project_id = (event.get("[fields][abi_project_id]") || 1).to_i
      project_token = (event.get("[fields][abi_project_token]") || "").to_s

      event.set("project_id", project_id)
      event.set("project_token", project_token)
      event.set("events", [evt])
    '
  }

  # 3. 清理 Beats 附加的宿主元数据字段，仅保留 ABI `/collect/api/v1/track/batch` 契约顶层字段
  mutate {
    remove_field => ["@version", "@timestamp", "message", "host", "agent", "log", "input", "ecs", "tags", "fields"]
  }
}

output {
  # 通道 A（默认推荐）：通过 HTTP Gzip 上报至 ABI Ingest Gateway (:8081)
  http {
    url => "http://127.0.0.1:8081/collect/api/v1/track/batch"
    http_method => "post"
    format => "json"
    content_type => "application/json"
    http_compression => true
    automatic_retries => 5
    retry_non_idempotent => true
    connect_timeout => 5
    socket_timeout => 10
    pool_max => 50
  }

  # 通道 B（可选高吞吐旁路）：当已通过网关鉴权体系时，也可配置直写 Kafka `track_raw` Topic
  # kafka {
  #   bootstrap_servers => "127.0.0.1:9092"
  #   topic_id => "track_raw"
  #   codec => "json"
  #   compression_type => "snappy"
  #   acks => "1"
  # }
}
